name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docs/DOCKER.md
      - go.mod
      - go.sum
      - web/package.json
      - web/pnpm-lock.yaml
      - web/pnpm-workspace.yaml
      - internal/capture/bpf/capture.c
      - internal/capture/generate.go
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - docs/DOCKER.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify BTF is available
        run: test -r /sys/kernel/btf/vmlinux

      - name: Build image
        run: docker build --build-arg VERSION=ci -t ebpfshark:ci .

      - name: Inspect image
        run: |
          docker image inspect ebpfshark:ci --format '{{.Config.Entrypoint}} {{.Config.ExposedPorts}}'
          docker run --rm --entrypoint /usr/local/bin/ebpfshark ebpfshark:ci -version
