name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          check-latest: true
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-common linux-tools-generic
          BPFTOOL=$(find /usr/lib/linux-tools -name bpftool | sort | tail -1)
          test -n "$BPFTOOL"
          sudo ln -sf "$(readlink -f "$BPFTOOL")" /usr/local/bin/bpftool

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish standalone binaries and update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          for arch in amd64 arm64; do
            for variant in core full; do
              archive="$(find dist -maxdepth 2 -type f -name "ebpfshark_${version}_${variant}_linux_${arch}.tar.gz" -print -quit)"
              if [[ -z "$archive" ]]; then
                echo "missing archive for ${variant}/${arch}" >&2
                exit 1
              fi
              mkdir -p "$work/${variant}-${arch}"
              tar -xzf "$archive" -C "$work/${variant}-${arch}"
              asset="ebpfshark-${variant}-linux-${arch}"
              cp "$work/${variant}-${arch}/ebpfshark" "$work/${asset}"
              sha="$(sha256sum "$work/${asset}" | awk '{print $1}')"
              cat > "$work/manifest-${variant}-linux-${arch}.json" <<EOF
          {"version":"${version}","url":"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${asset}","sha256":"${sha}"}
          EOF
              gh release upload "$GITHUB_REF_NAME" \
                "$work/${asset}" \
                "$work/manifest-${variant}-linux-${arch}.json" \
                --clobber
            done
          done
          rm -rf "$work"
