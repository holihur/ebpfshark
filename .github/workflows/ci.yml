name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Core + full protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev bpftool

      - name: Generate eBPF objects
        run: make generate

      - name: Vet core
        run: go vet ./...

      - name: Vet full
        run: go vet -tags full ./...

      - name: Test core with race detector
        run: go test -race ./...

      - name: Test full with race detector
        run: go test -race -tags full ./...

      - name: Build core
        run: make go-build

      - name: Build full
        run: make go-build-full

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build web
        working-directory: web
        run: pnpm run build
