name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Core + full protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Install eBPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-common linux-tools-generic
          # linux-tools-common provides a wrapper that looks for a kernel-matched
          # bpftool. Runners often use a different kernel flavour, so point it at
          # the generic tools we just installed.
          BPFTOOL=$(find /usr/lib/linux-tools -name bpftool | sort | tail -1)
          test -n "$BPFTOOL"
          sudo ln -sf "$(readlink -f "$BPFTOOL")" /usr/local/bin/bpftool
          bpftool version

      - name: Generate eBPF objects
        run: make generate

      - name: Vet core
        run: go vet ./...

      - name: Vet full
        run: go vet -tags full ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Test core with race detector
        run: go test -race ./...

      - name: Test full with race detector
        run: go test -race -tags full ./...

      - name: Fuzz core decode
        run: go test -run=^$ -fuzz=FuzzDecode -fuzztime=8s ./internal/decode

      - name: Fuzz core protocol payloads
        run: go test -run=^$ -fuzz=FuzzProtocolPayloads -fuzztime=8s ./internal/decode

      - name: Fuzz full decode
        run: go test -tags full -run=^$ -fuzz=FuzzDecode -fuzztime=8s ./internal/decode

      - name: Fuzz capture filter compiler
        run: go test -run=^$ -fuzz=FuzzCompileCapture -fuzztime=8s ./internal/filter

      - name: Kernel capture filter integration test
        run: sudo -E env "PATH=$PATH" "EBPFSHARK_PRIVILEGED=1" go test -run TestKernelCaptureFilter -count=1 ./internal/capture

      - name: Benchmark smoke
        run: go test -run=^$ -bench=. -benchmem -benchtime=50ms ./internal/decode ./internal/filter ./internal/stream

      - name: Build core
        run: make go-build

      - name: Build full
        run: make go-build-full

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Build example dynamic plugin
        run: go build -buildmode=plugin -o /tmp/ebpfshark-demo.so ./examples/plugins/demo

      - name: Test dynamic plugin loading
        run: EBPFSHARK_TEST_PLUGIN=/tmp/ebpfshark-demo.so go test -run TestLoadDynamicPlugin ./internal/decode

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          check-latest: true
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build web
        working-directory: web
        run: pnpm run build
